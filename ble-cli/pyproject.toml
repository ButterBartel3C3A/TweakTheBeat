[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ble-cli"
version = "0.1.0"
description = "Protocol-agnostic BLE debugging CLI for humans and AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["bleak>=0.22"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ble-cli = "blecli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
